<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Safe Cracker · 접속 QR</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @page{size:A4;margin:0}
  *{box-sizing:border-box}
  body{margin:0;background:#e9ecf2;font-family:'Noto Sans KR',system-ui,sans-serif;color:#111}
  .bar{position:sticky;top:0;background:#111a2c;color:#fff;padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;z-index:2}
  .bar button{background:#f5c044;border:0;border-radius:10px;padding:10px 20px;font:inherit;font-weight:900;cursor:pointer}
  .bar span{font-size:13px;opacity:.85}
  .page{width:210mm;height:297mm;margin:12px auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18);
    display:flex;flex-direction:column;align-items:center;padding:16mm 14mm 12mm;position:relative;overflow:hidden}
  .page::before{content:"";position:absolute;inset:7mm;border:3px solid #111;border-radius:8mm;pointer-events:none}
  .top{font-size:6.5mm;font-weight:700;color:#555;letter-spacing:.06em}
  h1{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:18mm;line-height:1;margin:3mm 0 2mm;letter-spacing:.01em;white-space:nowrap}
  h1 .lock{font-size:15mm}
  .sub{font-size:7.5mm;font-weight:900;margin:0 0 6mm}
  .sub b{background:#f5c044;padding:0 2.5mm;border-radius:2mm}
  #qr{width:158mm;height:158mm;padding:5mm;border:2.5mm solid #111;border-radius:6mm;display:grid;place-items:center;background:#fff}
  #qr img,#qr canvas{width:100%!important;height:100%!important;image-rendering:pixelated}
  .url{margin-top:5mm;font-family:'Space Mono',monospace;font-size:5mm;word-break:break-all;text-align:center;color:#333}
  .steps{margin-top:6mm;display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;width:100%;padding:0 4mm}
  .steps div{border:1.2mm solid #111;border-radius:4mm;padding:3.5mm 3mm;text-align:center;font-size:5.2mm;font-weight:900;line-height:1.3}
  .steps i{display:block;font-style:normal;font-family:'Space Mono',monospace;font-size:8mm;color:#c8901a;margin-bottom:1mm}
  .foot{margin-top:auto;font-size:4.2mm;color:#666}
  @media print{body{background:#fff}.bar{display:none}.page{margin:0;box-shadow:none}}
</style>
</head>
<body>
<div class="bar">
  <b>🖨️ 학생 접속 QR (A4)</b>
  <button onclick="print()">인쇄하기</button>
  <span>인쇄 설정: A4 · 배율 100% · 여백 없음 · 머리글/바닥글 끄기 · 배경 그래픽 켜기</span>
</div>
<div class="page">
  <div class="top">6학년 영어 · How often do you ~?</div>
  <h1><span class="lock">🔐</span> SAFE CRACKER</h1>
  <p class="sub">태블릿 카메라로 찍고 <b>금고 털이 요원</b>으로 접속하세요!</p>
  <div id="qr"></div>
  <div class="url" id="url"></div>
  <div class="steps">
    <div><i>1</i>📷 QR 찍기</div>
    <div><i>2</i>우리 반 고르기</div>
    <div><i>3</i>우리 팀 번호 고르기</div>
  </div>
  <div class="foot">한 번 고르면 태블릿에 저장돼요 · 다른 팀에게 비밀 카드를 보여 주지 마세요 🤫</div>
</div>
<script>
const url = location.href.replace(/[^/]*$/, "");   // 이 사이트의 첫 화면(학생 앱)
document.getElementById("url").textContent = url.replace(/^https?:\/\//, "");
try { new QRCode(document.getElementById("qr"), { text: url, width: 1024, height: 1024, correctLevel: QRCode.CorrectLevel.M }); }
catch { document.getElementById("qr").textContent = url; }
</script>
</body>
</html>
