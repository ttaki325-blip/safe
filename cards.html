<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Safe Cracker · 비밀 카드</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  @page{size:A4;margin:8mm}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Noto Sans KR',sans-serif;color:#111;background:#e9ecf2}
  .bar{position:sticky;top:0;background:#111a2c;color:#fff;padding:12px 18px;display:flex;gap:14px;align-items:center;z-index:2}
  .bar button{background:#f5c044;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:900;cursor:pointer}
  .bar label{font-size:14px}
  .page{width:194mm;min-height:281mm;margin:10px auto;background:#fff;padding:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:139mm;gap:0;page-break-after:always;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .page:last-child{page-break-after:auto}
  .card{border:1.2px dashed #9aa3b5;padding:4mm 5mm;overflow:hidden;display:flex;flex-direction:column}
  .card .hd{display:flex;align-items:center;gap:8px;border-bottom:2px solid #111;padding-bottom:3mm;margin-bottom:2.5mm}
  .card .no{font-family:'Space Mono',monospace;font-size:30px;background:#111;color:#f5c044;border-radius:8px;padding:0 10px;line-height:1.3}
  .card .tt{font-family:'Black Han Sans',sans-serif;font-size:22px;line-height:1.1}
  .card .tt small{display:block;font-family:'Noto Sans KR';font-size:10.5px;color:#666;font-weight:400}
  .row{display:grid;grid-template-columns:13mm 1fr;gap:.5mm 2mm;padding:1.4mm 0;border-bottom:1px dotted #ccd}
  .row:last-of-type{border-bottom:0}
  .tag{font-family:'Space Mono',monospace;font-size:14px;text-align:center;border-radius:6px;padding:1px 0;align-self:start}
  .tag.a{background:#d9ecff;color:#0b4a8a}.tag.b{background:#efe2ff;color:#5a2a99}
  .q{font-size:12px;color:#555;line-height:1.25}
  .ans{grid-column:2;font-size:14.5px;line-height:1.25;font-weight:900}
  .chk{grid-column:2;font-size:11px;color:#2a7a3a}
  .foot{margin-top:auto;font-size:11.5px;color:#555;text-align:center;line-height:1.35;background:#f6f6f8;border-radius:5px;padding:1.2mm}
  .foot b{color:#111}
  .key{grid-column:1/-1;padding:5mm 6mm}
  .key h1{font-family:'Black Han Sans',sans-serif;margin:0 0 2mm}
  .key p{margin:0 0 5mm;color:#a00;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:10.5px}
  th,td{border:1px solid #bbb;padding:.8mm 1.5mm;text-align:left}
  th{background:#f2f2f2}
  td.code{font-family:'Space Mono',monospace;font-size:18px;text-align:center;letter-spacing:3px}
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5mm;margin-top:3mm;font-size:10.5px}
  .board div{border:1px solid #ccc;border-radius:6px;padding:2mm}
  /* 학생용 안내 */
  .guide{grid-column:1/-1;padding:6.24mm 7.02mm;display:flex;flex-direction:column;gap:3.4mm}
  .guide h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:11.36mm;margin:0;line-height:1;display:flex;align-items:baseline;gap:3.12mm}
  .guide h1 small{font-family:'Noto Sans KR';font-size:4.02mm;font-weight:700;color:#666}
  .mission{background:#111;color:#fff;border-radius:3.12mm;padding:3.12mm 3.9mm;font-size:5.42mm;font-weight:900}
  .mission b{color:#f5c044}
  .gsec{border:.7mm solid #111;border-radius:3.12mm;padding:2.73mm 3.51mm}
  .gsec h2{margin:0 0 1.95mm;font-size:4.89mm;font-weight:900;display:flex;align-items:center;gap:1.56mm}
  .gsec h2 i{font-style:normal;font-family:'Space Mono',monospace;background:#f5c044;border-radius:1.56mm;padding:0 1.56mm;font-size:4.37mm}
  .gsec p{margin:0;font-size:3.75mm;line-height:1.55}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:2.34mm}
  .role{border-radius:2.34mm;padding:2.34mm 2.73mm;font-size:3.75mm;line-height:1.5}
  .role.at{background:#ffe8dc}.role.df{background:#dcecff}
  .role b{font-size:4.19mm}
  .talk{display:flex;flex-direction:column;gap:1.4mm}
  .say{display:flex;gap:1.95mm;align-items:center;font-size:4.19mm}
  .say span{border-radius:2.34mm;padding:1.25mm 2.73mm;font-weight:700}
  .say.at span{background:#ffe8dc}.say.df{justify-content:flex-end}.say.df span{background:#dcecff}
  .say em{font-style:normal;font-size:3.15mm;color:#666;min-width:9.36mm}
  .flow{display:grid;grid-template-columns:repeat(3,1fr);gap:1.95mm}
  .flow div{background:#f3f4f8;border-radius:2.34mm;padding:2.34mm;font-size:3.58mm;line-height:1.45;text-align:center}
  .flow div strong{display:block;font-size:4.11mm;margin-bottom:0.78mm}
  .chips{display:flex;gap:1.56mm;flex-wrap:wrap;font-size:3.58mm}
  .chips span{border:.4mm solid #111;border-radius:99px;padding:.6mm 2.34mm}
  .blue{color:#1857b8;font-weight:900}.red{color:#c4142f;font-weight:900}
  .promise{display:grid;grid-template-columns:1fr 1fr;gap:1.17mm 3.12mm;font-size:3.67mm;line-height:1.45}
  @media print{body{background:#fff}.bar{display:none}.page{margin:0;box-shadow:none}}
</style>
</head>
<body>
<div class="bar">
  <b>🖨️ 비밀 카드 인쇄</b>
  <label>사용할 카드 수 <select id="n"></select></label>
  <label><input type="checkbox" id="withGuide" checked> 학생용 활동 안내 포함</label>
  <label>카드 종류 <select id="mode"><option value="clue">🕵️ 추리 카드 (힌트로 대답)</option><option value="easy">🙂 쉬운 카드 (정답 그대로)</option></select></label>
  <button onclick="print()">인쇄하기</button>
  <span style="font-size:13px;opacity:.8">인쇄 설정: A4 · 배율 100% · 머리글/바닥글 끄기 · 첫 장(활동 안내)은 화면에 띄우거나 팀마다 1장 · 점선대로 자르기 · 마지막 장(정답표)은 선생님만!</span>
</div>
<div id="out"></div>
<script src="data.js"></script>
<script>
const sel = document.getElementById("n");
sel.innerHTML = Array.from({length: SC_CONFIG.MAX_TEAMS}, (_, i) => i + 1).reverse()
  .map(n => `<option value="${n}">${n}장</option>`).join("");
sel.onchange = render;
const modeSel = document.getElementById("mode");
modeSel.onchange = render;
const guideChk = document.getElementById("withGuide");
guideChk.onchange = render;

/* 학생용 활동 안내 (A4 한 장) */
function guide(){
  const clue = modeSel.value === "clue";
  const talk = clue
    ? `<div class="say at"><em>🗡️ 공격</em><span>How often do you exercise?</span></div>
       <div class="say df"><span>I exercise <b>on Monday and Thursday.</b></span><em>🛡️ 수비</em></div>
       <div class="say at"><em>🗡️ 공격</em><span>Twice a week?</span></div>
       <div class="say df"><span><b>That's right!</b> &nbsp;(틀리면 No. Listen again.)</span><em>🛡️ 수비</em></div>
       <div class="say at"><em>🗡️ 공격</em><span><b>Good for you!</b> / You should exercise more often.</span></div>`
    : `<div class="say at"><em>🗡️ 공격</em><span>How often do you exercise?</span></div>
       <div class="say df"><span>I exercise <b>twice a week.</b></span><em>🛡️ 수비</em></div>
       <div class="say at"><em>🗡️ 공격</em><span><b>Good for you!</b> / You should exercise more often.</span></div>`;
  const tr = SC_SCORE.TREASURE.map(x => x.pts);
  return `<div class="page" style="grid-auto-rows:auto"><div class="guide">
    <h1>🔐 SAFE CRACKER <small>금고 털이 요원 활동 안내</small></h1>
    <div class="mission">🎯 미션: 친구 팀을 영어로 인터뷰해서 <b>다른 팀 금고를 열고</b> 점수를 모아라!</div>

    <div class="gsec"><h2><i>1</i> 공격과 수비는 번갈아 가며!</h2>
      <div class="two">
        <div class="role at"><b>🗡️ 공격 시간</b><br>태블릿을 들고 둘이 같이 출동!<br>화면에 <b>주황색</b>으로 뜬 팀만 찾아갈 수 있어요.</div>
        <div class="role df"><b>🛡️ 수비 시간</b><br>자리에 앉아 <b>비밀 카드</b>를 펴 두고<br>찾아온 팀의 질문에 대답해요.</div>
      </div>
      <p style="margin-top:2mm">⏱️ 교대 시간은 태블릿과 교실 앞 화면이 알려 줘요. &nbsp;👥 요원 A = 1·3번, 요원 B = 2·4번 질문·대답 담당</p>
    </div>

    <div class="gsec"><h2><i>2</i> 이렇게 대화해요</h2><div class="talk">${talk}</div></div>

    <div class="gsec"><h2><i>3</i> 금고 여는 법</h2>
      <div class="flow">
        <div><strong>📝 대답 기록</strong>들은 대답을 질문마다<br>대답 보드에서 터치</div>
        <div><strong>🧠 규칙 찾기</strong>대답 카드 4장이 나와요.<br><b>숨은 규칙</b>대로 줄 세우기!<br>(규칙은 비밀! 직접 찾아요)</div>
        <div><strong>🔓 열기</strong>틀리면 <span class="blue">파란 카드 = 제자리</span><br><span class="red">빨간 카드 = 자리 틀림</span><br>끌어서 다시 바꾸기</div>
      </div>
      <p style="margin-top:2mm">🚨 같은 금고를 <b>${SC_CONFIG.ALARM_TRIES}번</b> 틀리면 경보! <b>${SC_CONFIG.ALARM_SEC}초</b> 동안 잠겨요. 막 누르지 말고 생각하기!</p>
    </div>

    <div class="gsec"><h2><i>4</i> 점수</h2>
      <div class="chips">
        <span>🔓 금고 열기 +${SC_SCORE.BASE}</span>
        <span>🧠 규칙을 처음 찾은 팀 +${SC_SCORE.RULE.join("/")}</span>
        <span>🎯 한 번에 성공 +${SC_SCORE.PERFECT}</span>
        <span>🥇 그 금고를 먼저 열기 +${SC_SCORE.FIRST.join("/")}</span>
        <span>💎 금고 속 보물 +${Math.min(...tr)}~${Math.max(...tr)}</span>
      </div>
    </div>

    <div class="gsec"><h2>🤝 요원의 약속</h2>
      <div class="promise">
        <div>🤫 비밀 카드는 다른 팀에게 보여 주지 않기</div>
        <div>🗣️ 카드 문장 그대로, 또박또박 말하기</div>
        <div>🙋 못 알아들으면 "Pardon?" / "Can you say that again?"</div>
        <div>🚶 교실에서는 걸어서 이동하기</div>
      </div>
    </div>
  </div></div>`;
}

function card(t){
  const s = SC.safe(t);
  const clue = modeSel.value === "clue";
  const rows = s.acts.map((act, i) => {
    const ag = i % 2 === 0 ? "a" : "b", n = +s.ans[i];
    return `<div class="row"><span class="tag ${ag}">A${i+1}</span>
      <span class="q">Q${i+1}. ${SC.question(act)} <b>(요원 ${ag.toUpperCase()})</b></span>
      <span class="ans">${clue ? SC.clueSentence(act, n, t, i) : SC.answerSentence(act, n)}</span>
      ${clue ? `<span class="chk">✔ 확인용 정답: ${SC_ANSWERS[n].en}</span>` : ""}</div>`;
  }).join("");
  const foot = clue
    ? `🤫 정답(빈도)은 말하지 말고 <b>굵은 힌트 문장</b>만 읽어 주세요.<br>맞히면 <b>"That's right!"</b> · 틀리면 <b>"No. Listen again."</b>`
    : `질문을 들으면 카드에 있는 문장 그대로 대답하세요`;
  return `<div class="card"><div class="hd"><span class="no">${t}</span>
    <span class="tt">비밀 ${clue ? "힌트" : "대답"} 카드<small>SAFE ${t} · 다른 팀에게 절대 보여 주지 마세요! 🤫</small></span></div>
    ${rows}<div class="foot">${foot}</div></div>`;
}

function render(){
  const n = +sel.value, ts = Array.from({length: n}, (_, i) => i + 1);
  let html = guideChk.checked ? guide() : "";
  for (let i = 0; i < ts.length; i += 4) html += `<div class="page">${ts.slice(i, i+4).map(card).join("")}</div>`;
  html += `<div class="page" style="grid-auto-rows:auto"><div class="key">
    <h1>🔑 교사용 정답표</h1><p>⚠️ 학생에게 보여 주지 마세요 · 암호 규칙: 가장 자주 하는 질문 번호 → 가장 덜 하는 질문 번호 순서</p>
    <table><tr><th>금고</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>코드</th></tr>
    ${ts.map(t => { const s = SC.safe(t);
      return `<tr><td><b>${t}</b></td>${s.acts.map((a,i) => `<td>${SC_ACTIVITIES[a][0]}<br><b>${SC_ANSWERS[+s.ans[i]].en}</b></td>`).join("")}<td class="code">${SC.codeOf(t)}</td></tr>`; }).join("")}
    </table>
    <div class="board">${SC_ANSWERS.slice(1).map((a,i) => `<div><b>${i+1}</b> ${a.en}. — ${a.good ? "Good for you!" : "You should ~ more often."}</div>`).join("")}</div>
  </div></div>`;
  document.getElementById("out").innerHTML = html;
}
render();
</script>
</body>
</html>
